services:

  backend:
    image: rkrakesh069/image-enhancer-backend:${IMAGE_TAG:-latest}
#    image: rkrakesh069/image-enhancer-backend:1.0.0
    container_name: image-enhancer-backend
    environment:
      - PORT=3000
      - UPLOAD_DIR=/app/uploads
      - DB_HOST=db
      - DB_NAME=image_enhancer
      - DB_USER=app_user
      - DB_PASSWORD=app_password
    volumes:
      - enhanced-images:/app/uploads
    networks:
      - enhancer-net
    depends_on:
      db:
        condition: service_healthy

  frontend:
#    image: rkrakesh069/image-enhancer-frontend:1.0.0
    image: rkrakesh069/image-enhancer-frontend:${IMAGE_TAG:-latest}
    container_name: image-enhancer-frontend
    ports:
      - "8080:80"
    networks:
      - enhancer-net
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    container_name: image-enhancer-db
    environment:
      - POSTGRES_DB=image_enhancer
      - POSTGRES_USER=app_user
      - POSTGRES_PASSWORD=app_password
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - enhancer-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d image_enhancer"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  enhancer-net:

volumes:
  enhanced-images:
  db-data: